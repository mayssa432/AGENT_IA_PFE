[pytest]
# ============================================================
# Configuration pytest — Agent IA Appium PFE
# ============================================================

# Répertoires de tests
testpaths = tests

# Affichage
addopts =
    -v
    --tb=short
    -p no:warnings

# Tests à ignorer par défaut (nécessitent Appium/Groq/network)
# Pour les ignorer en ligne de commande : pytest --ignore=tests/test_agent.py
collect_ignore_glob =
    tests/test_agent.py
    tests/test_groq_client.py

# Marqueurs personnalisés
markers =
    unit:        Tests unitaires purs (pas de dépendances externes)
    integration: Tests d'intégration (nécessitent des ressources)
    device:      Tests nécessitant un device Appium connecté
    network:     Tests nécessitant un accès réseau (API Groq, etc.)

# Timeout par défaut (en secondes)
timeout = 30

# Filtres de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
